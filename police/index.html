<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Phone Location Tracker</title>

<!-- Leaflet Map -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #222;
    padding: 15px;
    text-align: center;
}

h1 {
    margin: 0;
}

#map {
    height: 70vh;
    width: 100%;
}

#info {
    padding: 20px;
    background: #1b1b1b;
}

.info-box {
    background: #292929;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

#startBtn {
    background: #28a745;
    color: white;
}

#stopBtn {
    background: #dc3545;
    color: white;
}

.status {
    color: #00ff88;
    font-weight: bold;
}

</style>
</head>

<body>

<header>
    <h1>📍 Live Phone Location Tracker</h1>
    <p id="status" class="status">
        Waiting for permission...
    </p>
</header>

<div id="map"></div>

<div id="info">

    <button id="startBtn">
        Start Tracking
    </button>

    <button id="stopBtn">
        Stop Tracking
    </button>

    <div class="info-box">
        Latitude:
        <span id="latitude">--</span>
    </div>

    <div class="info-box">
        Longitude:
        <span id="longitude">--</span>
    </div>

    <div class="info-box">
        Accuracy:
        <span id="accuracy">--</span> meters
    </div>

    <div class="info-box">
        Last Update:
        <span id="time">--</span>
    </div>

</div>


<!-- Leaflet JavaScript -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Default map location
let map = L.map("map").setView([6.5244, 3.3792], 13);

// OpenStreetMap
L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "© OpenStreetMap contributors"
    }
).addTo(map);


// Marker
let marker = null;

// Accuracy circle
let accuracyCircle = null;

// GPS watch ID
let watchID = null;


// Start tracking

document
.getElementById("startBtn")
.addEventListener("click", startTracking);


// Stop tracking

document
.getElementById("stopBtn")
.addEventListener("click", stopTracking);



function startTracking() {

    if (!navigator.geolocation) {

        document.getElementById("status").textContent =
            "Geolocation is not supported by this device.";

        return;
    }


    document.getElementById("status").textContent =
        "Requesting GPS permission...";


    watchID = navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }

    );

}



function updateLocation(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    // Update text

    document.getElementById("latitude")
        .textContent =
        latitude.toFixed(6);


    document.getElementById("longitude")
        .textContent =
        longitude.toFixed(6);


    document.getElementById("accuracy")
        .textContent =
        accuracy.toFixed(1);


    document.getElementById("time")
        .textContent =
        new Date().toLocaleTimeString();


    document.getElementById("status")
        .textContent =
        "Tracking active";


    const location =
        [latitude, longitude];


    // Create or move marker

    if (marker === null) {

        marker = L.marker(location)

            .addTo(map)

            .bindPopup("📱 Current Phone Location")

            .openPopup();

    }

    else {

        marker.setLatLng(location);

    }


    // Accuracy circle

    if (accuracyCircle !== null) {

        map.removeLayer(accuracyCircle);

    }


    accuracyCircle = L.circle(

        location,

        {
            radius: accuracy

        }

    ).addTo(map);


    // Move map

    map.setView(location, 17);

}



function locationError(error) {

    let message;


    switch(error.code) {

        case error.PERMISSION_DENIED:

            message =
            "Location permission was denied.";

            break;


        case error.POSITION_UNAVAILABLE:

            message =
            "Location information is unavailable.";

            break;


        case error.TIMEOUT:

            message =
            "Location request timed out.";

            break;


        default:

            message =
            "An unknown location error occurred.";

    }


    document.getElementById("status")
        .textContent = message;

}



function stopTracking() {

    if (watchID !== null) {

        navigator.geolocation.clearWatch(watchID);

        watchID = null;

    }


    document.getElementById("status")
        .textContent =
        "Tracking stopped.";

}

</script>

</body>
</html>
